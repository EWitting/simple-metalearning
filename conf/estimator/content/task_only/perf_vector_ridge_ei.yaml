# BayesianRidge EI on performance-vector features (collaborative, Linear-Perf).
# Each flow is represented by its performance on other training tasks; a per-task
# BayesianRidge model uses the equal-weight prior (tasks are exchangeable) and EI
# drives acquisition.  No hyperparameter content features are used.
_target_: functools.partial
_args_:
  - _target_: hydra.utils.get_class
    path: simple_metalearning.estimators.bayesian_ridge_ei.BayesianRidgeEIEstimator
fit_intercept: false
use_metadata: false
prior_equal_weight: false
prior_shape: 2.0
f_star_from_predictions: false
acquisition_fn:
  _target_: simple_metalearning.estimators.acquisition.EIGaussianAcquisition
  xi: 0.0
