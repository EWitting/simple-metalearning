# BayesianRidge on performance-vector features with sklearn default priors (BayesRidge-EI-Default).
# fit_intercept=True, prior_equal_weight=False — sklearn out-of-the-box settings.
_target_: functools.partial
_args_:
  - _target_: hydra.utils.get_class
    path: simple_metalearning.estimators.bayesian_ridge_ei.BayesianRidgeEIEstimator
fit_intercept: true
use_metadata: false
prior_equal_weight: false
prior_shape: 2.0
f_star_from_predictions: false
acquisition_fn:
  _target_: simple_metalearning.estimators.acquisition.EIGaussianAcquisition
  xi: 0.0
