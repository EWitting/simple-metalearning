# Plain Ridge regression on performance-vector features, greedy acquisition (Ridge-Greedy).
_target_: functools.partial
_args_:
  - _target_: hydra.utils.get_class
    path: simple_metalearning.estimators.linear_regression_estimator.LinearRegressionEstimator
model_type: ridge
alpha: 1.0
fit_intercept: false
acquisition_fn:
  _target_: simple_metalearning.estimators.acquisition.GreedyAcquisition
