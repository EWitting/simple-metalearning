_target_: functools.partial
_args_:
  - _target_: hydra.utils.get_class
    path: simple_metalearning.estimators.task_only_rf_ei.TaskOnlyRandomForestEIEstimator
rf_model:
  _target_: sklearn.ensemble.RandomForestRegressor
  n_estimators: 100
  random_state: 42
  # SMAC uses min_samples_leaf=3 (not max_depth) to prevent singleton leaves.
  # With min_samples_leaf=1 (sklearn default), trees memorise individual training
  # points → near-zero in-sample variance but enormous between-tree variance for
  # unseen flows → every unobserved flow gets inflated EI → model over-explores
  # indefinitely even when the best option has already been found.
  # min_samples_leaf=3 smooths leaf predictions and keeps uncertainty calibrated.
  min_samples_leaf: 3
# Use best observed value as f_star (correct for deterministic table lookups).
# Set to true only if observations are noisy (e.g. real training runs).
f_star_from_predictions: false
# Acquisition function — override on the CLI without a separate yaml file:
#   estimator.acquisition_fn._target_=simple_metalearning.estimators.acquisition.CostCooledEIAcquisition
#   estimator.acquisition_fn._target_=simple_metalearning.estimators.acquisition.UCBAcquisition
acquisition_fn:
  _target_: simple_metalearning.estimators.acquisition.EIForestAcquisition
  xi: 0.0