# BayesianRidge EI on flow hyperparameter features (content-based, true Linear-Hyper).
# Each flow is represented by its hyperparameter values; a per-task BayesianRidge
# model is trained on observed (flow, performance) pairs and EI drives acquisition.
_target_: functools.partial
_args_:
  - _target_: hydra.utils.get_class
    path: simple_metalearning.estimators.bayesian_ridge_ei.BayesianRidgeEIEstimator
fit_intercept: false
use_metadata: true
prior_equal_weight: false
prior_shape: 2.0
f_star_from_predictions: false
acquisition_fn:
  _target_: simple_metalearning.estimators.acquisition.EIGaussianAcquisition
  xi: 0.0
